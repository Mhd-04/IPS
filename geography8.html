<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مذاكرة الجغرافيا - الثامن | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        .question-card { border-radius: 20px; background: white; padding: 20px; margin-bottom: 20px; border-right: 8px solid #db2777; shadow: 0 4px 15px rgba(0,0,0,0.05); }
        textarea { width: 100%; padding: 12px; border: 2px solid #fce7f3; border-radius: 12px; min-height: 100px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #db2777; background-color: #fffbff; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="pb-20">

    <div id="examArea">
        <div class="female-theme p-8 text-white text-center shadow-2xl mb-10">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 shadow-lg bg-white">
            <h1 class="text-3xl font-extrabold">مذاكرة مادة الجغرافية - الصف الثامن</h1>
            <p id="infoDisplay" class="mt-2 text-lg font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-4 max-w-4xl">
            <div id="questionsContainer"></div>
            
            <div class="text-center mt-10 no-print">
                <button onclick="downloadGeographyPDF()" class="bg-green-600 text-white px-12 py-5 rounded-3xl font-bold text-2xl shadow-2xl hover:bg-green-700 transition transform active:scale-95">
                    حفظ الإجابات وتحميل الملف PDF
                </button>
            </div>
        </div>
    </div>

<script>
    // جلب البيانات من الـ LocalStorage
    const sName = localStorage.getItem('sName') || "طالبة مجتهدة";
    const sSection = localStorage.getItem('sSection') || "-";
    document.getElementById('infoDisplay').innerText = `الطالبة: ${sName} | الشعبة: ${sSection}`;

    const questions = [
        "ما صفات جزر قارة اوقيانوسيا؟",
        "كم تبلغ مساحة قارة اوقيانوسيا وما هي اكبر جزيرة فيها؟",
        "أين تقع قارة اوقيانوسيا ؟ تكلم عن الموقع الفلكي ؟",
        "بما تمتاز جزيرة استراليا؟",
        "مما نشأت الجزر البركانيه في قاره اوقيانوسيا وما أبرزها؟",
        "فسر تتصف قارة أوقيانوسيا بالصفة المحيطية؟",
        "عدد الاقاليم المناخية والنباتية الموجودة في قاره اوقيانوسيا واشرح اقليم منها؟",
        "تحدث عن الشبكه المائيه لقاره اوقيانوسيا؟",
        "ما هي الحيوانات الموجودة في قاره اوقيانوسيا؟",
        "من هم السكان الاصليون للقارة؟",
        "تحدث عن الهجرة إلى أوقيانوسيا؟",
        "تحدث عن التوزع الجغرافي لسكان قارة اوقيانوسيا؟",
        "كم تبلغ الكثافة السكانية العامة في القارة؟",
        "تحدث عن النمو والتركيب السكاني للقارة؟",
        "ماهو نمط المعيشة في قارة اوقيانوسيا؟"
    ];

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-xl font-bold mb-3 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتبي إجابتكِ هنا..."></textarea>
                </div>
            `;
        });
    }

    async function downloadGeographyPDF() {
        const element = document.getElementById('examArea');
        const opt = {
            margin: [10, 5, 10, 5],
            filename: `جغرافيا_الثامن_${sName}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css'] }
        };
        
        // مهلة بسيطة لضمان ثبات النص المكتوب في الـ PDF
        await html2pdf().set(opt).from(element).save();
    }

    renderQuestions();
</script>
</body>
</html>
