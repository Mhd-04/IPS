<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز جغرافية - الصف الثامن | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff; margin: 0; padding: 0; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); color: white; }
        
        /* تصميم كرت السؤال ليظهر بوضوح في الطباعة */
        .question-card { 
            background: white !important; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 10px solid #db2777; 
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            page-break-inside: avoid; /* يمنع انقسام السؤال بين صفحتين */
            display: block !important;
        }

        /* صندوق الإجابة القابل للكتابة */
        .answer-box { 
            width: 100%; 
            min-height: 100px; 
            margin-top: 15px;
            padding: 15px; 
            border: 2px solid #fce7f3; 
            border-radius: 10px; 
            font-size: 1.1rem;
            line-height: 1.6;
            outline: none;
            background: #fff;
            cursor: text;
        }

        .info-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; 
            background: rgba(255, 255, 255, 0.2); padding: 15px; border-radius: 12px;
            text-align: right; font-size: 0.9rem;
        }

        /* تنسيقات خاصة عند ضغط زر الحفظ (PDF) */
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .header-bg { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .question-card { border: 1px solid #eee; border-right: 10px solid #db2777; box-shadow: none; }
            .answer-box { border: 1px solid #ddd; }
        }
    </style>
</head>
<body class="pb-24">

    <div id="printArea" class="max-w-4xl mx-auto shadow-xl min-h-screen">
        <div class="female-theme p-6 text-center shadow-lg mb-8">
            <div class="flex justify-between items-center mb-6">
                <img src="1000219663.jpg" class="w-20 h-20 rounded-full border-2 border-white bg-white">
                <div>
                    <h1 class="text-3xl font-black italic">كويز مادة الجغرافية</h1>
                    <p class="text-xl opacity-90">الصف الثامن الأساسي - قارة أوقيانوسيا</p>
                </div>
                <div class="text-right text-xs opacity-80">
                    <p>المدرسة: IPS</p>
                    <p id="currentDate"></p>
                </div>
            </div>

            <div class="info-grid">
                <div>اسم الطالبة: <span id="sn" class="font-bold underline"></span></div>
                <div>الشعبة: <span id="sc" class="font-bold underline"></span></div>
                
            </div>
        </div>

        <div id="questionsContainer" class="p-6"></div>
        <div class="p-6">
            <div class="bg-pink-50 border-2 border-dashed border-pink-300 p-6 rounded-2xl">
                <h3 class="text-xl font-bold text-pink-900 mb-4 border-b border-pink-200 pb-2 italic"> التقييم (خاص بالمدرس):</h3>
                <div class="flex justify-between items-center">
                    <div class="text-lg">الدرجة النهائية: <span class="text-3xl text-pink-700 font-black">/ 100</span></div>
                    <div class="text-lg">توقيع المدرس: .....................</div>
                </div>
            </div>
        </div>
    </div>

    <div class="no-print fixed bottom-0 left-0 right-0 p-4 bg-white/90 border-t z-50 text-center">
        <button onclick="window.print()" class="bg-gradient-to-r from-pink-700 to-rose-600 text-white px-16 py-5 rounded-full font-black text-2xl shadow-2xl active:scale-95 transition-all">
             حفظ الورقة بصيغة PDF (الخيار المضمون)
        </button>
    </div>

<script>
    // جلب البيانات من الذاكرة
    document.getElementById('sn').innerText = localStorage.getItem('sName') || "الاء فرحان الغفري";
    document.getElementById('sc').innerText = localStorage.getItem('sSection') || "G";
    document.getElementById('fn').innerText = localStorage.getItem('fName') || "عمر";
    document.getElementById('fp').innerText = localStorage.getItem('fPhone') || "09********";
    document.getElementById('db').innerText = localStorage.getItem('dob') || "2011/01/01";
    document.getElementById('sid').innerText = localStorage.getItem('sID') || "2026-800";
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ar-SY');

    // مصفوفة الـ 15 سؤالاً بالكامل
    const geoQuestions = [
        "ما صفات جزر قارة اوقيانوسيا؟",
        "كم تبلغ مساحة قارة اوقيانوسيا وما هي اكبر جزيرة فيها؟",
        "أين تقع قارة اوقيانوسيا ؟ تكلم عن الموقع الفلكي ؟",
        "بما تمتاز جزيرة استراليا؟",
        "مما نشأت الجزر البركانيه في قاره اوقيانوسيا وما أبرزها؟",
        "فسر تتصف قارة أوقيانوسيا بالصفة المحيطية؟",
        "عدد الاقاليم المناخية والنباتية الموجودة في قاره اوقيانوسيا واشرح اقليم منها؟",
        "تحدث عن الشبكه المائيه لقاره اوقيانوسيا؟",
        "ما هي الحيوانات الموجودة في قاره اوقيانوسيا؟",
        "من هم السكان الاصليون للقارة؟",
        "تحدث عن الهجرة إلى أوقيانوسيا؟",
        "تحدث عن التوزع الجغرافي لسكان قارة اوقيانوسيا؟",
        "كم تبلغ الكثافة السكانية العامة في القارة؟",
        "تحدث عن النمو والتركيب السكاني للقارة؟",
        "ماهو نمط المعيشة في قارة اوقيانوسيا؟"
    ];

    const container = document.getElementById('questionsContainer');
    geoQuestions.forEach((q, i) => {
        container.innerHTML += `
            <div class="question-card">
                <h3 class="text-xl font-bold text-gray-800">${i + 1}) ${q}</h3>
                <div contenteditable="true" class="answer-box" placeholder="اكتبي الإجابة هنا..."></div>
            </div>
        `;
    });
</script>
</body>
</html>
