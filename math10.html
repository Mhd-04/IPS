<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الوحدة الثالثة مادة الرياضيات للصف الأول الثانوي  - 
      | IPS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f9; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .exam-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 15px; shadow: 0 0 20px rgba(0,0,0,0.1); }
        .question-card { border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        .correct { border: 2px solid #28a745 !important; background-color: #f1fcf4 !important; }
        .wrong { border: 2px solid #dc3545 !important; background-color: #fff5f5 !important; }
        .student-header { background: #007bff; color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="exam-container">
        <div class="student-header text-center">
            <h2>ورقة عمل مادة الرياضيات - الصف العاشر</h2>
            <p>وحدة الجبر والهندسة (أتمتة)</p>
        </div>

        <div class="row g-3 mb-4 p-3 bg-light rounded">
            <div class="col-md-6">
                <label>اسم الطالب:</label>
                <input type="text" id="sName" class="form-control" placeholder="أدخل اسمك الكامل">
            </div>
            <div class="col-md-6">
                <label>رقم الطالب (ID):</label>
                <input type="text" id="sID" class="form-control" placeholder="رقم الهوية">
            </div>
        </div>

        <form id="fullExam">
            <h4 class="text-primary mb-4">السؤال الأول: اختر الإجابة الصحيحة</h4>
            <div id="mcq-area"></div>

            <hr class="my-5">

            <h4 class="text-primary mb-4">السؤال الثاني: أجب بـ (صح) أو (خطأ)</h4>
            <div id="tf-area"></div>

            <div class="text-center">
                <button type="button" class="btn btn-success btn-lg px-5 shadow" onclick="calculateResult()">إرسال وتصحيح تلقائي</button>
                <div id="finalScore" class="mt-4 display-6 fw-bold"></div>
            </div>
        </form>
    </div>
</div>

<script>
// مصفوفة الأسئلة مستخرجة بالكامل من الصور
const mcqs = [
    { q: "إذا علمت أن أحد حلول المعادلة 3x² + x - 2 = 0 هو x₁ = -1 فالحل الآخر هو:", opts: ["x = 1/2", "x = 3/2", "x = -3/2"], ans: 1 },
    { q: "إحدى طرق حل معادلة من الدرجة الثانية استخدام المميز Δ وقيمته:", opts: ["c² - 4ab", "b² - 4ac", "a² - 4bc"], ans: 1 },
    { q: "ليكن لدينا شعاعين لهما البداية نفسها ناتج جمعهما هو الشعاع:", opts: ["بداية الأول ثم نهاية الثاني", "قطر متوازي الأضلاع المنشأ عليهما", "نهاية الأول بداية الثاني"], ans: 1 },
    { q: "ناتج ضرب شعاع u بالعدد k = -4 هو شعاع ku له:", opts: ["نفس اتجاه الشعاع u", "عكس اتجاه الشعاع u", "طويلة الشعاع u نفسها"], ans: 1 },
    { q: "الصيغة القانونية لثلاثي الحدود f(x) = 2x² - 4x + 3 هي:", opts: ["2(x-1)² - 1", "2(x+1)² + 1", "2(x-1)² + 1"], ans: 2 },
    { q: "أصغر قيمة للتابع f(x) = 2x² - 4x + 3 هي:", opts: ["+2", "-1", "+1"], ans: 2 },
    { q: "حل المعادلة x² - 2x + 1 = 0 هو:", opts: ["مستحيلة الحل", "x₁ = x₂ = 1 حل مضاعف", "x₁ = 1, x₂ = 2 حلين مختلفين"], ans: 1 },
    { q: "إشارة العبارة x² - 2x + 1 هي:", opts: ["موجبة", "غير موجب وغير سالب", "سالبة"], ans: 0 },
    { q: "إحدى طرق حل المتراجحة -2x² + 3x + 2 ≥ 0 استخدام المميز وقيمته:", opts: ["Δ = +25", "Δ = -25", "Δ = 0"], ans: 0 },
    { q: "نستنتج أن حل المعادلة -2x² + 3x + 2 = 0 هو:", opts: ["x₁ = -1/2 و x₂ = 2", "مستحيلة الحل", "x = 3/4"], ans: 0 },
    { q: "يكون حل المتراجحة -2x² + 3x + 2 ≥ 0 هو:", opts: ["x ∈ [-1/2, 2]", "x ∈ ]-∞, -1/2] ∪ [2, +∞[", "x ∈ ]-1/2, 2["], ans: 0 }
];

const tfs = [
    { q: "الشعاع الصفري لا منحى له", ans: "صح" },
    { q: "شرط الارتباط الخطي لشعاعين هو أن يكون لهما الطويلة نفسها", ans: "خطأ" },
    { q: "يستعمل الارتباط الخطي لإثبات وقوع ثلاث نقاط على استقامة واحدة", ans: "صح" },
    { q: "إذا كانت E, F منتصف الضلعين [AC], [AB] فإن BC = 1/2 EF", ans: "خطأ" },
    { q: "المعادلة 2x² - 4x + 3 = 0 مستحيلة الحل", ans: "صح" },
    { q: "إشارة العبارة 2x² - 4x + 3 سالبة دائماً", ans: "خطأ" },
    { q: "ناتج اختزال الشعاع u = 3/4(2i-4j) + 1/3(-i+6j) هو 5i - 11/6j", ans: "صح" },
    { q: "إذا كان ABC مثلث متساوي الأضلاع كان BC=AC=AB", ans: "خطأ" }, // حسب الصورة
    { q: "العلاقة الشعاعية (BA - AC) - CD = AB - CD = DA صحيحة", ans: "صح" }
];

// توليد الأسئلة في الصفحة
function render() {
    const mcqArea = document.getElementById('mcq-area');
    mcqs.forEach((m, i) => {
        mcqArea.innerHTML += `
            <div class="question-card" id="mcq-${i}">
                <p class="fw-bold">${i+1}) ${m.q}</p>
                ${m.opts.map((o, j) => `<div class="form-check"><input class="form-check-input" type="radio" name="m${i}" value="${j}"> ${o}</div>`).join('')}
            </div>`;
    });

    const tfArea = document.getElementById('tf-area');
    tfs.forEach((t, i) => {
        tfArea.innerHTML += `
            <div class="question-card" id="tf-${i}">
                <p class="fw-bold">${i+1}) ${t.q}</p>
                <button type="button" class="btn btn-outline-success btn-sm me-2" onclick="setTF(${i}, 'صح')">صح</button>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="setTF(${i}, 'خطأ')">خطأ</button>
            </div>`;
    });
}

let tfAnswers = {};
function setTF(i, v) { tfAnswers[i] = v; }

function calculateResult() {
    let score = 0;
    mcqs.forEach((m, i) => {
        const sel = document.querySelector(`input[name="m${i}"]:checked`);
        if(sel && parseInt(sel.value) === m.ans) { score++; document.getElementById(`mcq-${i}`).className = "question-card correct"; }
        else { document.getElementById(`mcq-${i}`).className = "question-card wrong"; }
    });

    tfs.forEach((t, i) => {
        if(tfAnswers[i] === t.ans) { score++; document.getElementById(`tf-${i}`).className = "question-card correct"; }
        else { document.getElementById(`tf-${i}`).className = "question-card wrong"; }
    });

    document.getElementById('finalScore').innerText = "النتيجة: " + score + " / " + (mcqs.length + tfs.length);
}
render();
</script>
</body>
</html>
