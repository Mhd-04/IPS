<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كويز الرياضيات - الأول الثانوي | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .male-theme { background: linear-gradient(135deg, #4b5563, #1f2937); }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        .question-card { border-radius: 25px; border: 2px solid transparent; transition: all 0.3s; margin-bottom: 1.5rem; padding: 1.5rem; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .correct { border: 3px solid #10b981 !important; background-color: #f0fdf4 !important; }
        .wrong { border: 3px solid #ef4444 !important; background-color: #fef2f2 !important; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="captureArea">
        <div id="headerBox" class="p-8 text-white text-center shadow-2xl mb-10">
            <img src="1000219663.jpg" class="w-28 h-28 mx-auto rounded-full border-4 border-white bg-white mb-4 shadow-lg">
            <h1 class="text-3xl font-extrabold">كويز الرياضيات - الوحدة الثالثة</h1>
            <p id="studentInfo" class="mt-2 text-lg font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-4 max-w-3xl">
            <div id="mcqContainer"></div>
            <div id="tfContainer"></div>

            <div id="resultBox" class="mt-10 p-8 rounded-3xl text-center hidden mb-10 border-4 shadow-2xl">
                <h3 id="scoreText" class="text-4xl font-black mb-4"></h3>
                <button onclick="safeDownloadPDF()" id="pdfBtn" class="no-print bg-green-600 text-white px-10 py-4 rounded-2xl font-bold text-xl shadow-lg hover:bg-green-700 transition transform">
                    تحميل النتيجة PDF لإرسالها للمدرس
                </button>
            </div>
        </div>
    </div>

    <div class="text-center sticky bottom-5 no-print" id="submitArea">
        <button onclick="gradeFullExam()" class="bg-blue-600 text-white px-12 py-5 rounded-3xl font-bold text-2xl shadow-2xl hover:scale-105 transition transform">إنهاء الاختبار وعرض النتيجة</button>
    </div>

<script>
    const sName = localStorage.getItem('sName') || "طالب زائر";
    const sTheme = localStorage.getItem('sTheme') || 'female';
    const sSection = localStorage.getItem('sSection') || '-';

    document.getElementById('headerBox').classList.add(sTheme === 'male' ? 'male-theme' : 'female-theme');
    document.getElementById('studentInfo').innerText = `الطالب/ة: ${sName} | الشعبة: ${sSection}`;

    const mcqs = [
        { q: "إذا علمت أن أحد حلول المعادلة \\(3x^2 + x - 2 = 0\\) هو \\(x_1 = -1\\) فالحل الآخر هو:", opts: ["\\(x = \\frac{1}{2}\\)", "\\(x = \\frac{2}{3}\\)", "\\(x = -\\frac{3}{2}\\)"], ans: 1 },
        { q: "إحدى طرق حل معادلة من الدرجة الثانية استخدام المميز \\(\\Delta\\) وقيمته:", opts: ["\\(c^2 - 4ab\\)", "\\(b^2 - 4ac\\)", "\\(a^2 - 4bc\\)"], ans: 1 },
        { q: "ليكن لدينا شعاعين لهما البداية نفسها ناتج جمعهما هو الشعاع:", opts: ["بداية الأول ثم نهاية الثاني", "قطر متوازي الأضلاع المنشأ عليهما", "نهاية الأول بداية الثاني"], ans: 1 },
        { q: "ناتج ضرب شعاع \\(u\\) بالعدد \\(k = -4\\) هو شعاع \\(ku\\) له:", opts: ["نفس اتجاه الشعاع \\(u\\)", "عكس اتجاه الشعاع \\(u\\)", "طويلة الشعاع \\(u\\) نفسها"], ans: 1 },
        { q: "الصيغة القانونية لثلاثي الحدود \\(f(x) = 2x^2 - 4x + 3\\) هي:", opts: ["\\(2(x-1)^2 - 1\\)", "\\(2(x+1)^2 + 1\\)", "\\(2(x-1)^2 + 1\\)"], ans: 2 },
        { q: "أصغر قيمة للتابع \\(f(x) = 2x^2 - 4x + 3\\) هي:", opts: ["\\(+2\\)", "\\(-1\\)", "\\(+1\\)"], ans: 2 },
        { q: "حل المعادلة \\(x^2 - 2x + 1 = 0\\) هو:", opts: ["مستحيلة الحل", "\\(x_1 = x_2 = 1\\) حل مضاعف", "\\(x_1 = 1, x_2 = 2\\) حلين مختلفين"], ans: 1 },
        { q: "إشارة العبارة \\(x^2 - 2x + 1\\) هي:", opts: ["موجبة", "غير موجب وغير سالب", "سالبة"], ans: 0 },
        { q: "إحدى طرق حل المتراجحة \\(-2x^2 + 3x + 2 \\ge 0\\) استخدام المميز وقيمته:", opts: ["\\(\\Delta = +25\\)", "\\(\\Delta = -25\\)", "\\(\\Delta = 0\\)"], ans: 0 },
        { q: "نستنتج أن حل المعادلة \\(-2x^2 + 3x + 2 = 0\\) هو:", opts: ["\\(x_1 = -\\frac{1}{2}\\) و \\(x_2 = 2\\)", "مستحيلة الحل", "\\(x = \\frac{3}{4}\\)"], ans: 0 },
        { q: "يكون حل المتراجحة \\(-2x^2 + 3x + 2 \\ge 0\\) هو:", opts: ["\\(x \\in [-\\frac{1}{2}, 2]\\)", "\\(x \\in ]-\\infty, -\\frac{1}{2}] \\cup [2, +\\infty[\\)", "\\(x \\in ]-\\frac{1}{2}, 2[\\)"], ans: 0 }
    ];

    const tfs = [
        { q: "الشعاع الصفري لا منحى له", ans: "صح" },
        { q: "شرط الارتباط الخطي لشعاعين هو أن يكون لهما الطويلة نفسها", ans: "خطأ" },
        { q: "يستعمل الارتباط الخطي لإثبات وقوع ثلاث نقاط على استقامة واحدة", ans: "صح" },
        { q: "إذا كانت E, F منتصف الضلعين [AC], [AB] فإن \\(BC = \\frac{1}{2} EF\\)", ans: "خطأ" },
        { q: "المعادلة \\(2x^2 - 4x + 3 = 0\\) مستحيلة الحل", ans: "صح" },
        { q: "إشارة العبارة \\(2x^2 - 4x + 3\\) سالبة دائماً", ans: "خطأ" },
        { q: "ناتج اختزال الشعاع \\(u = \\frac{3}{4}(2i-4j) + \\frac{1}{3}(-i+6j)\\) هو \\(5i - \\frac{11}{6}j\\)", ans: "صح" },
        { q: "إذا كان ABC مثلث متساوي الأضلاع كان BC=AC=AB", ans: "صح" },
        { q: "العلاقة الشعاعية \\((BA - AC) - CD = DA\\) صحيحة", ans: "صح" }
    ];

    let tfUserAns = {};

    function init() {
        const mcqCont = document.getElementById('mcqContainer');
        mcqs.forEach((item, i) => {
            mcqCont.innerHTML += `
                <div id="mcqCard${i}" class="question-card text-right">
                    <h3 class="text-xl font-bold mb-4">${i + 1}) ${item.q}</h3>
                    <div class="grid grid-cols-1 gap-3">
                        ${item.opts.map((opt, j) => `
                            <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="m${i}" value="${j}" class="w-5 h-5 ml-2">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>`;
        });

        const tfCont = document.getElementById('tfContainer');
        tfs.forEach((item, i) => {
            tfCont.innerHTML += `
                <div id="tfCard${i}" class="question-card flex justify-between items-center">
                    <p class="text-lg font-bold">${i + 1}) ${item.q}</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="setTF(${i}, 'صح')" id="tf${i}صح" class="px-5 py-2 rounded-xl border-2 font-bold">صح</button>
                        <button type="button" onclick="setTF(${i}, 'خطأ')" id="tf${i}خطأ" class="px-5 py-2 rounded-xl border-2 font-bold">خطأ</button>
                    </div>
                </div>`;
        });
        if(window.MathJax) MathJax.typeset();
    }

    function setTF(i, val) {
        tfUserAns[i] = val;
        document.getElementById(`tf${i}صح`).className = val === 'صح' ? "px-5 py-2 rounded-xl bg-green-500 text-white font-bold" : "px-5 py-2 rounded-xl border-2 font-bold";
        document.getElementById(`tf${i}خطأ`).className = val === 'خطأ' ? "px-5 py-2 rounded-xl bg-red-500 text-white font-bold" : "px-5 py-2 rounded-xl border-2 font-bold";
    }

    function gradeFullExam() {
        let score = 0;
        document.querySelectorAll('input[type="radio"]').forEach(inp => inp.disabled = true);
        document.querySelectorAll('button[onclick^="setTF"]').forEach(btn => btn.disabled = true);

        mcqs.forEach((item, i) => {
            const sel = document.querySelector(`input[name="m${i}"]:checked`);
            const card = document.getElementById(`mcqCard${i}`);
            if(sel && parseInt(sel.value) === item.ans) { score++; card.classList.add('correct'); }
            else { card.classList.add('wrong'); }
        });

        tfs.forEach((item, i) => {
            const card = document.getElementById(`tfCard${i}`);
            if(tfUserAns[i] === item.ans) { score++; card.classList.add('correct'); }
            else { card.classList.add('wrong'); }
        });

        const total = mcqs.length + tfs.length;
        document.getElementById('submitArea').style.display = 'none';
        const resBox = document.getElementById('resultBox');
        resBox.classList.remove('hidden');
        resBox.className = "mt-10 p-8 rounded-3xl text-center border-4 shadow-2xl " + (score >= total/2 ? "bg-green-100 border-green-500 text-green-800" : "bg-red-100 border-red-500 text-red-800");
        document.getElementById('scoreText').innerText = `النتيجة النهائية: ${score} من ${total}`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // الوظيفة المنقذة لحل مشكلة الـ PDF الفارغ
    async function safeDownloadPDF() {
        const element = document.getElementById('captureArea');
        const btn = document.getElementById('pdfBtn');
        btn.innerText = "جاري المعالجة... انتظر قليلاً";
        btn.disabled = true;

        // انتظار 2 ثانية لضمان استقرار كل العناصر الرياضية
        await new Promise(r => setTimeout(r, 2000));

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `نتيجة_رياضيات_${sName}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                useCORS: true, 
                letterRendering: true,
                scrollY: -window.scrollY 
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).toPdf().get('pdf').then(function (pdf) {
            btn.innerText = "تم التحميل!";
            setTimeout(() => { btn.innerText = "تحميل النتيجة PDF"; btn.disabled = false; }, 2000);
        }).save();
    }

    init();
</script>
</body>
</html>
