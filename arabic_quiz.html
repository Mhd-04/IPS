<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار قصيدة ربوع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .correct { border-color: #10b981 !important; background-color: #f0fdf4; }
        .wrong { border-color: #ef4444 !important; background-color: #fef2f2; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">

<div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-3xl overflow-hidden">
    <div class="bg-pink-600 p-6 text-white text-center">
        <h1 class="text-3xl font-bold">اختبار قصيدة "ربوع"</h1>
        <p class="mt-2 opacity-90" id="scoreDisplay">أجب عن جميع الأسئلة ثم اضغط على عرض النتيجة</p>
    </div>

    <div id="quizContainer" class="p-6 space-y-8">
        </div>

    <div class="p-6 border-t flex gap-4 justify-center no-print">
        <button id="gradeBtn" onclick="gradeQuiz()" class="bg-pink-600 hover:bg-pink-700 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg active:scale-95">عرض النتيجة</button>
        <button id="printBtn" onclick="window.print()" class="hidden bg-slate-800 hover:bg-slate-900 text-white px-8 py-3 rounded-xl font-bold transition-all shadow-lg">طباعة النتيجة (window.print)</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "الحالة الشعورية التي سيطرت على الشاعر في البيتين هي:",
            opts: ["أ) الفرح والسّرور بلقاء الأحبة.", "ب) الفخر والاعتزاز بالماضي.", "ج) الحزن والشّوق وألم الاغتراب.", "د) الغضب والسّخط على الأعداء."],
            ans: 2 // ج
        },
        {
            q: "المقصود بقول الشاعر (فأنْهَلوني بكأسٍ مِن محبَّتِهم دِهاقِ) في البيت (ظمئت إلى الحياة فأنهلوني.. بكأسٍ من محبّتهم دهاقِ):",
            opts: ["أ) أنّ أصدقاءه قدّموا له الماء ليرتوي.", "ب) أنّ لقاء الأصدقاء ومحبّتهم أعادت له الحياة والأمل.", "ج) أنّهم أقاموا له احتفالاً كبيراً.", "د) أنّه كان عطشاً جداً في سفره."],
            ans: 1 // ب
        },
        {
            q: "العبارة التي تدلّ على حبّ الشّاعر لوطنه في السّرّاء والضّرّاء (السّلم والحرب) هي:",
            opts: ["أ) أحبّك تنشرين الجود.", "ب) أحبّك في النّعيم وفي الرّزايا.", "ج) ديار الخلد كنت لنا شموخاً.", "د) ويبقى للعروبة منتداها."],
            ans: 1 // ب
        },
        {
            q: "يشير الشاعر في البيت التاسع (وكم سُمتِ العدوَّ الفظَّ خَسْفاً) إلى:",
            opts: ["أ) كثرة المفاوضات مع العدو.", "ب) تجاهل العدوّ وعدم الاكتراث به.", "ج) انتصار الوطن وإذلاله للمستعمر الظّالم.", "د) معاناة الوطن من ظلم الأعداء."],
            ans: 2 // ج
        },
        {
            q: "القيمة البارزة في البيت (ويبقى للعروبةِ مُنتَداها...أبيّ القلب ممدود الرّواق) هي:",
            opts: ["أ) تقدير العلم والعلماء.", "ب) الاعتزاز بالانتماء القومي.", "ج) الحنين إلى الماضي البعيد.", "د) الإعجاب بجمال الطّبيعة."],
            ans: 1 // ب
        },
        {
            q: "الفكرة الفرعيّة التي يتناولها البيت (أُحبُّكِ تَنشُرينَ الجُودَ...حتّى يفوح شذاه في السّبع الطّباق):",
            opts: ["أ) تضحيات الوطن في المعارك.", "ب) عطاء الوطن وكرمه الذي يعمّ الآفاق.", "ج) جمال طبيعة الوطن وخلودها.", "د) شوق الشّاعر للعودة إلى الوطن."],
            ans: 1 // ب
        },
        {
            q: "نوع المشتقّ في كلمة (مشدود) الواردة في البيت الثّاني:",
            opts: ["أ) اسم فاعل.", "ب) صفة مشبّهة.", "ج) اسم مفعول.", "د) مبالغة اسم فاعل."],
            ans: 2 // ج
        },
        {
            q: "الوزن الصّرفي للمصدر (اشتياق) ونوع فعله:",
            opts: ["أ) افتعال (فعل خماسي).", "ب) انفعال (فعل خماسي).", "ج) إفعال (فعل رباعي).", "د) استفعال (فعل سداسي)."],
            ans: 0 // أ
        },
        {
            q: "كلمة (الفظّ) في قوله (العدوّ الفظّ) مشتقّ نوعه:",
            opts: ["أ) اسم فاعل.", "ب) صفة مشبّهة باسم الفاعل.", "ج) اسم تفضيل.", "د) اسم آلة."],
            ans: 1 // ب
        },
        {
            q: "إعراب جملة (قد بلَغَتْ) في البيت الثامن (أذاكرةٌ عهوداً من كفاحٍ ...وقد بلَغَتْ بنا الرُّوحُ التَّراقي):",
            opts: ["أ) في محل نصب حال.", "ب) في محل جر مضاف إليه.", "ج) في محل رفع صفة.", "د) استئنافية لا محل لها من الإعراب."],
            ans: 0 // أ
        },
        {
            q: "إعراب جملة (أفاضت) في البيت العاشر (رُبوعٌ للعروبةِ ما أفاضَتْ... ومن أجل العروبة ما تلاقي):",
            opts: ["أ) في محل رفع خبر.", "ب) في محل نصب حال.", "ج) صلة الموصول لا محل لها من الإعراب.", "د) في محل جر صفة."],
            ans: 2 // ج
        },
        {
            q: "إعراب جملة (هاجتني) في البيت (تهيّمني حنيني واشتياقي...وهاجتني مناجاةُ الرِّفاقِ):",
            opts: ["أ) في محل رفع خبر.", "ب) في محل نصب حال.", "ج) معطوفة على جملة ابتدائية لا محل لها من الإعراب مثلها.", "د) في محل جرّ بالإضافة."],
            ans: 2 // ج
        },
        {
            q: "المحسّن البديعي المعنوي في البيت السّادس بين كلمتي (النّعيم) و (الرّزايا):",
            opts: ["أ) طباق إيجاب.", "ب) طباق سلب.", "ج) جناس ناقص.", "د) مقابلة."],
            ans: 0 // أ
        },
        {
            q: "مصدر الموسيقا الداخليّة البارز في البيت الأوّل (اشتياقي / الرِّفاقِ):",
            opts: ["أ) الجناس.", "ب) التّصريع.", "ج) الطّباق.", "د) أ+ب"],
            ans: 1 // ب
        },
        {
            q: "إعراب كلمة (حليفَ) في البيت الثاني (وكنتُ على البعادِ حليفَ غمٍّ):",
            opts: ["أ) خبر (كان) منصوب.", "ب) مفعول به منصوب.", "ج). حال منصوبة", "د) تمييز منصوب."],
            ans: 0 // أ
        },
        {
            q: "إعراب كلمة (ديارَ) في البيت الخامس (ديارَ الخُلدِ كُنتِ لنا شموخاً .....):",
            opts: ["أ) مبتدأ مرفوع.", "ب) مفعول به لفعل محذوف.", "ج) منادى مضاف منصوب.", "د) بدل منصوب."],
            ans: 2 // ج
        },
        {
            q: "إعراب كلمة (الفظَّ) في البيت التاسع (وكم سُمتِ العدوَّ الفظَّ خسفاً.....):",
            opts: ["أ) مفعول به ثانٍ منصوب.", "ب) صفة (نعت) منصوبة.", "ج) حال منصوبة.", "د) مضاف إليه مجرور."],
            ans: 1 // ب
        },
        {
            q: "إعراب كلمة (أبيَّ) في البيت الحادي عشر (ويبقى للعروبة منتداها... أبيَّ القلبِ ممدود الرّواق):",
            opts: ["أ) حال منصوبة.", "ب) خبر (يبقى) منصوب.", "ج) مفعول به منصوب.", "د) صفة منصوبة."],
            ans: 0 // أ
        },
        {
            q: "في قول الشّاعر (ظمئت إلى الحياة) ، (قد بلغت بنا الرّوح التّراقي) أسلوبان خبريّان:",
            opts: ["أ) الأول إنكاري والثّاني طلبي", "ب) الأول ابتدائي والثاني ابتدائي", "ج) كلاهما طلبي", "د) الأول ابتدائي والثّاني طلبي"],
            ans: 3 // د
        },
        {
            q: "التّقطيع العروضي للبيت (أذاكرةٌ عهوداً من كفاحٍ... وقد بلغت بنا الرّوح التّراقي) من البحر الوافر:",
            opts: [
                "أ) أذاكرةٌ /عهوداً من / كفاحٍ وقد بلغت ب/ نا الرّوح الت /تراقي",
                "ب) أذاكرةٌ /عهوداً من/ كفاحٍ وقد بلغت/ بنا الرّوح الت/ تراقي",
                "ج) أذا/ كرةٌ عهو/ داً من / كفاحٍ وقد بلغ/ ت بنا الرّو/ح الت/ تراقي",
                "د) أذاكر/ ةٌ عهو/داً من / كفاحٍ وقد بل/ غت بنا / الرّوح/ التّراقي"
            ],
            ans: 1 // ب
        }
    ];

    function init() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = questions.map((item, i) => `
            <div id="qCard${i}" class="p-5 border-2 border-slate-100 rounded-2xl transition-all">
                <h3 class="text-xl font-bold mb-4 text-slate-800">${i + 1}. ${item.q}</h3>
                <div class="grid grid-cols-1 gap-3">
                    ${item.opts.map((opt, j) => `
                        <label class="flex items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
                            <input type="radio" name="q${i}" value="${j}" class="w-5 h-5 ml-3 accent-pink-600">
                            <span class="text-lg">${opt}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function gradeQuiz() {
        let score = 0;
        questions.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const card = document.getElementById(`qCard${i}`);
            
            if (selected && parseInt(selected.value) === item.ans) {
                score++;
                card.classList.add('correct');
            } else {
                card.classList.add('wrong');
                // تظليل الإجابة الصحيحة باللون الأخضر الخفيف عند الخطأ
                const correctRadio = card.querySelectorAll('label')[item.ans];
                correctRadio.style.backgroundColor = "#dcfce7";
                correctRadio.style.borderColor = "#22c55e";
            }
            // قفل الخيارات
            card.querySelectorAll('input').forEach(el => el.disabled = true);
        });

        const total = questions.length;
        document.getElementById('scoreDisplay').innerHTML = `النتيجة النهائية: <span class="text-yellow-200 font-bold">${score} من ${total}</span>`;
        document.getElementById('gradeBtn').classList.add('hidden');
        document.getElementById('printBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    init();
</script>
</body>
</html>
