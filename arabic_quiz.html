<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار قصيدة ربوع - مدرسة ابن خلدون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .poem-box { font-family: 'Amiri', serif; font-size: 1.4rem; border-right: 6px solid #db2777; line-height: 2; }
        .option-card { border: 1px solid #e2e8f0; border-radius: 0.75rem; transition: all 0.2s; display: flex; align-items: center; padding: 0.75rem; cursor: pointer; background: white; }
        .option-card:hover { background-color: #fdf2f8; border-color: #f472b6; }
        .correct-ans { border-color: #10b981 !important; background-color: #f0fdf4; border-width: 2px; }
        .wrong-ans { border-color: #ef4444 !important; background-color: #fef2f2; border-width: 2px; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-2 md:p-6">

<div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-slate-200">
    <div class="bg-pink-600 p-5 text-white flex items-center justify-between shadow-md">
        <div class="flex items-center gap-4">
            <img src="1000219663.jpg" alt="لوغو مدرسة ابن خلدون" onerror="this.src='https://via.placeholder.com/80?text=KH'" class="w-20 h-20 bg-white rounded-full p-1 object-contain shadow-lg border-2 border-pink-200">
            <div>
                <h1 class="text-xl md:text-3xl font-bold">مدرسة ابن خلدون الخاصة</h1>
                <p class="text-sm md:text-md opacity-90 font-medium italic">اختبار مادة اللغة العربية: قصيدة "ربوع"</p>
            </div>
        </div>
        <div class="text-center bg-white/20 p-3 rounded-xl min-w-[100px] border border-white/30">
            <span class="block text-xs font-bold uppercase tracking-wider">النتيجة</span>
            <span id="scoreDisplay" class="text-2xl font-bold">-- / 20</span>
        </div>
    </div>

    <div class="p-5 bg-slate-50 border-b flex flex-col md:flex-row justify-between gap-4 shadow-inner no-print font-bold">
        <div class="flex items-center">
            <span class="text-slate-600 ml-2">اسم الطالب:</span> 
            <span id="displayName" class="text-pink-700">جاري التحميل...</span>
        </div>
        <div class="flex items-center border-r-2 pr-4 border-slate-200">
            <span class="text-slate-600 ml-2">الشعبة / الفئة:</span> 
            <span id="displaySection" class="text-pink-700">--</span>
        </div>
    </div>

    <div class="p-6 bg-white border-b relative">
        <p class="text-pink-600 font-bold mb-4 text-md flex items-center gap-2">
            <span class="w-2 h-2 bg-pink-600 rounded-full"></span> ورد في قصيدة ربوع:
        </p>
        <div class="poem-box bg-slate-50 p-6 rounded-xl shadow-sm border border-slate-100 italic text-center">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12">
                <div class="font-bold">تهـيّمني حـنيني واشـــتيـاقي</div>
                <div class="md:text-left font-bold">وهـاجتني مـــناجاة الــرّفاق</div>
                <div class="font-bold">وكنت على البعاد حليف غمٍّ</div>
                <div class="md:text-left font-bold">كئيب الصّدر مشدود الوثاق</div>
            </div>
        </div>
    </div>

    <div id="quizContainer" class="p-6 space-y-12 bg-white"></div>

    <div class="p-8 border-t flex flex-col md:flex-row gap-4 justify-center no-print bg-slate-50">
        <button id="gradeBtn" onclick="gradeQuiz()" class="bg-pink-600 hover:bg-pink-700 text-white px-16 py-4 rounded-2xl font-bold shadow-xl transition-all active:scale-95 text-xl">
            إرسال وتصحيح الاختبار
        </button>
        <button id="printBtn" onclick="window.print()" class="hidden bg-slate-800 hover:bg-slate-900 text-white px-16 py-4 rounded-2xl font-bold shadow-xl text-xl transition-all">
            طباعة نتيجة الطالب
        </button>
    </div>
</div>

<script>
    // 1. تعريف الأسئلة (مرة واحدة فقط)
    const questions = [
        { q: "الحالة الشعورية التي سيطرت على الشاعر في البيتين هي:", opts: ["أ) الفرح والسّرور بلقاء الأحبة.", "ب) الفخر والاعتزاز بالماضي.", "ج) الحزن والشّوق وألم الاغتراب.", "د) الغضب والسّخط على الأعداء."], ans: 2 },
        { q: "المقصود بقول الشاعر (فأنْهَلوني بكأسٍ مِن محبَّتِهم دِهاقِ) في البيت (ظمئت إلى الحياة فأنهلوني.. بكأسٍ من محبّتهم دهاقِ):", opts: ["أ) أنّ أصدقاءه قدّموا له الماء ليرتوي.", "ب) أنّ لقاء الأصدقاء ومحبّتهم أعادت له الحياة والأمل.", "ج) أنّهم أقاموا له احتفالاً كبيراً.", "د) أنّه كان عطشاً جداً في سفره."], ans: 1 },
        { q: "العبارة التي تدلّ على حبّ الشّاعر لوطنه في السّرّاء والضّرّاء (السّلم والحرب) هي:", opts: ["أ) أحبّك تنشرين الجود.", "ب) أحبّك في النّعيم وفي الرّزايا.", "ج) ديار الخلد كنت لنا شموخاً.", "د) ويبقى للعروبة منتداها."], ans: 1 },
        { q: "يشير الشاعر في البيت التاسع (وكم سُمتِ العدوَّ الفظَّ خَسْفاً) إلى:", opts: ["أ) كثرة المفاوضات مع العدو.", "ب) تجاهل العدوّ وعدم الاكتراث به.", "ج) انتصار الوطن وإذلاله للمستعمر الظّالم.", "د) معاناة الوطن من ظلم الأعداء."], ans: 2 },
        { q: "القيمة البارزة في البيت (ويبقى للعروبةِ مُنتَداها...أبيّ القلب ممدود الرّواق) هي:", opts: ["أ) تقدير العلم والعلماء.", "ب) الاعتزاز بالانتماء القومي.", "ج) الحنين إلى الماضي البعيد.", "د) الإعجاب بجمال الطّبيعة."], ans: 1 },
        { q: "الفكرة الفرعيّة التي يتناولها البيت (أُحبُّكِ تَنشُرينَ الجُودَ...):", opts: ["أ) تضحيات الوطن في المعارك.", "ب) عطاء الوطن وكرمه الذي يعمّ الآفاق.", "ج) جمال طبيعة الوطن وخلودها.", "د) شوق الشّاعر للعودة إلى الوطن."], ans: 1 },
        { q: "نوع المشتقّ في كلمة (مشدود) الواردة في البيت الثّاني:", opts: ["أ) اسم فاعل.", "ب) صفة مشبّهة.", "ج) اسم مفعول.", "د) مبالغة اسم فاعل."], ans: 2 },
        { q: "الوزن الصّرفي للمصدر (اشتياق) ونوع فعله:", opts: ["أ) افتعال (فعل خماسي).", "ب) انفعال (فعل خماسي).", "ج) إفعال (فعل رباعي).", "د) استفعال (فعل سداسي)."], ans: 0 },
        { q: "كلمة (الفظّ) في قوله (العدوّ الفظّ) مشتق نوعه:", opts: ["أ) اسم فاعل.", "ب) صفة مشبّهة باسم الفاعل.", "ج) اسم تفضيل.", "د) اسم آلة."], ans: 1 },
        { q: "إعراب جملة (قد بلَغَتْ) في البيت الثامن:", opts: ["أ) في محل نصب حال.", "ب) في محل جر مضاف إليه.", "ج) في محل رفع صفة.", "د) استئنافية لا محل لها من الإعراب."], ans: 0 },
        { q: "إعراب جملة (أفاضت) في البيت العاشر:", opts: ["أ) في محل رفع خبر.", "ب) في محل نصب حال.", "ج) صلة الموصول لا محل لها من الإعراب.", "د) في محل جر صفة."], ans: 2 },
        { q: "إعراب جملة (هاجتني) في البيت الأول:", opts: ["أ) في محل رفع خبر.", "ب) في محل نصب حال.", "ج) معطوفة على جملة ابتدائية لا محل لها من الإعراب مثلها.", "د) في محل جرّ بالإضافة."], ans: 2 },
        { q: "المحسّن البديعي المعنوي بين كلمتي (النّعيم) و (الرّزايا):", opts: ["أ) طباق إيجاب.", "ب) طباق سلب.", "ج) جناس ناقص.", "د) مقابلة."], ans: 0 },
        { q: "مصدر الموسيقا الداخليّة البارز (اشتياقي / الرِّفاقِ):", opts: ["أ) الجناس.", "ب) التّصريع.", "ج) الطّباق.", "د) أ+ب"], ans: 1 },
        { q: "إعراب كلمة (حليفَ) في البيت الثاني:", opts: ["أ) خبر (كان) منصوب.", "ب) مفعول به منصوب.", "ج) حال منصوبة.", "د) تمييز منصوب."], ans: 0 },
        { q: "إعراب كلمة (ديارَ) في البيت الخامس:", opts: ["أ) مبتدأ مرفوع.", "ب) مفعول به لفعل محذوف.", "ج) منادى مضاف منصوب.", "د) بدل منصوب."], ans: 2 },
        { q: "إعراب كلمة (الفظَّ) في البيت التاسع:", opts: ["أ) مفعول به ثانٍ منصوب.", "ب) صفة (نعت) منصوبة.", "ج) حال منصوبة.", "د) مضاف إليه مجرور."], ans: 1 },
        { q: "إعراب كلمة (أبيَّ) في البيت الحادي عشر:", opts: ["أ) حال منصوبة.", "ب) خبر (يبقى) منصوب.", "ج) مفعول به منصوب.", "د) صفة منصوبة."], ans: 0 },
        { q: "في قول الشّاعر (ظمئت إلى الحياة) أسلوب خبري نوعه:", opts: ["أ) إنكاري", "ب) ابتدائي", "ج) طلبي", "د) لا شيء مما سبق"], ans: 1 },
        { q: "التّقطيع العروضي للبيت الثامن من البحر الوافر:", opts: ["أ) خيار أ", "ب) خيار ب", "ج) خيار ج", "د) خيار د"], ans: 1 }
    ];

    // 2. وظيفة التحميل والبدء
    window.onload = function() {
        // جلب البيانات بالمسميات التي وضعتها في index.html
        document.getElementById('displayName').innerText = localStorage.getItem('sName') || "لم يتم إدخال الاسم";
        document.getElementById('displaySection').innerText = localStorage.getItem('sSection') || "--";
        init();
    };

    // 3. بناء واجهة الأسئلة
    function init() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = questions.map((item, i) => `
            <div id="qCard${i}" class="space-y-4 border-r-4 border-slate-100 pr-4 transition-all duration-300">
                <h3 class="text-xl font-bold text-slate-800 leading-relaxed">${i + 1}) ${item.q}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${item.opts.map((opt, j) => `
                        <label class="option-card group">
                            <input type="radio" name="q${i}" value="${j}" class="w-5 h-5 ml-3 accent-pink-600">
                            <span class="text-lg text-slate-700 font-medium">${opt}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // 4. دالة التصحيح
    function gradeQuiz() {
        let score = 0;
        questions.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const card = document.getElementById(`qCard${i}`);
            const options = card.querySelectorAll('.option-card');
            
            if (selected && parseInt(selected.value) === item.ans) {
                score++;
                options[item.ans].classList.add('correct-ans');
                card.style.borderRightColor = "#10b981";
            } else {
                if(selected) options[selected.value].classList.add('wrong-ans');
                options[item.ans].classList.add('correct-ans');
                card.style.borderRightColor = "#ef4444";
            }
            card.querySelectorAll('input').forEach(inp => inp.disabled = true);
        });

        document.getElementById('scoreDisplay').innerText = `${score} / 20`;
        document.getElementById('printBtn').classList.remove('hidden');
        document.getElementById('gradeBtn').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
