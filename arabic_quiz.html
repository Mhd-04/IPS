<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار قصيدة ربوع </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .poem-box { font-family: 'Amiri', serif; font-size: 1.3rem; border-right: 4px solid #db2777; }
        .correct { border-color: #10b981 !important; background-color: #f0fdf4; }
        .wrong { border-color: #ef4444 !important; background-color: #fef2f2; }
        .option-card { border: 1px solid #e2e8f0; border-radius: 0.75rem; transition: all 0.2s; }
        .option-card:hover { background-color: #f8fafc; border-color: #cbd5e1; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-100 p-2 md:p-6">

<div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
    <div class="bg-pink-600 p-5 text-white flex items-center justify-between">
        <div class="flex items-center gap-4">
            <img src="logo-url-here.png" alt="Logo" class="w-14 h-14 bg-white rounded-full p-1">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">مدرسة ابن خلدون الخاصة</h1>
                <p class="text-sm opacity-90">اختبار قصيدة "ربوع"</p>
            </div>
        </div>
        <div id="scoreBox" class="text-center bg-white/20 p-2 rounded-lg min-w-[80px]">
            <span class="block text-xs uppercase">النتيجة</span>
            <span id="scoreDisplay" class="text-xl font-bold">--</span>
        </div>
    </div>

    <div class="p-4 bg-slate-50 border-b grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
        <input type="text" placeholder="اسم الطالب الثلاثي" class="p-2 border rounded-lg outline-none focus:border-pink-500">
        <input type="text" placeholder="الرقم الامتحاني" class="p-2 border rounded-lg outline-none focus:border-pink-500">
    </div>

    <div class="p-6 bg-white text-center italic">
        <p class="text-pink-600 font-bold mb-3">ورد في قصيدة ربوع:</p>
        <div class="poem-box bg-slate-50 p-4 rounded-lg inline-block shadow-sm">
            <div class="flex flex-col md:flex-row gap-x-8">
                <span>تهـيّمني حـنيني واشـــتيـاقي &nbsp;&nbsp; وهـاجتني مـــناجاة الــرّفاق</span>
            </div>
            <div class="flex flex-col md:flex-row gap-x-8 mt-1">
                <span>وكنت على البعاد حليف غمٍّ &nbsp;&nbsp; كئيب الصّدر مشدود الوثاق</span>
            </div>
        </div>
    </div>

    <div id="quizContainer" class="p-4 md:p-6 space-y-6">
        </div>

    <div class="p-6 border-t flex gap-4 justify-center no-print">
        <button id="gradeBtn" onclick="gradeQuiz()" class="bg-pink-600 hover:bg-pink-700 text-white px-10 py-3 rounded-xl font-bold shadow-lg transition-transform active:scale-95">عرض النتيجة</button>
        <button id="printBtn" onclick="window.print()" class="hidden bg-slate-800 hover:bg-slate-900 text-white px-10 py-3 rounded-xl font-bold shadow-lg">طباعة (window.print)</button>
    </div>
</div>

<script>
    const questions = [
        { q: "الحالة الشعورية التي سيطرت على الشاعر في البيتين هي:", opts: ["الفرح والسّرور بلقاء الأحبة", "الفخر والاعتزاز بالماضي", "الحزن والشّوق وألم الاغتراب", "الغضب والسّخط على الأعداء"], ans: 2 },
        { q: "المقصود بقول الشاعر (فأنْهَلوني بكأسٍ مِن محبَّتِهم دِهاقِ):", opts: ["أنّ أصدقاءه قدّموا له الماء ليرتوي", "أنّ لقاء الأصدقاء ومحبّتهم أعادت له الحياة والأمل", "أنّهم أقاموا له احتفالاً كبيراً", "أنّه كان عطشاً جداً في سفره"], ans: 1 },
        { q: "العبارة التي تدلّ على حبّ الشّاعر لوطنه في السّرّاء والضّرّاء هي:", opts: ["أحبّك تنشرين الجود", "أحبّك في النّعيم وفي الرّزايا", "ديار الخلد كنت لنا شموخاً", "ويبقى للعروبة منتداها"], ans: 1 },
        { q: "يشير الشاعر في البيت التاسع (وكم سُمتِ العدوَّ الفظَّ خَسْفاً) إلى:", opts: ["كثرة المفاوضات مع العدو", "تجاهل العدوّ وعدم الاكتراث به", "انتصار الوطن وإذلاله للمستعمر الظّالم", "معاناة الوطن من ظلم الأعداء"], ans: 2 },
        { q: "القيمة البارزة في البيت (ويبقى للعروبةِ مُنتَداها...):", opts: ["تقدير العلم والعلماء", "الاعتزاز بالانتماء القومي", "الحنين إلى الماضي البعيد", "الإعجاب بجمال الطّبيعة"], ans: 1 },
        { q: "الفكرة الفرعيّة للبيت (أُحبُّكِ تَنشُرينَ الجُودَ...):", opts: ["تضحيات الوطن في المعارك", "عطاء الوطن وكرمه الذي يعمّ الآفاق", "جمال طبيعة الوطن وخلودها", "شوق الشّاعر للعودة إلى الوطن"], ans: 1 },
        { q: "نوع المشتقّ في كلمة (مشدود):", opts: ["اسم فاعل", "صفة مشبّهة", "اسم مفعول", "مبالغة اسم فاعل"], ans: 2 },
        { q: "الوزن الصّرفي للمصدر (اشتياق):", opts: ["افتعال (فعل خماسي)", "انفعال (فعل خماسي)", "إفعال (فعل رباعي)", "استفعال (فعل سداسي)"], ans: 0 },
        { q: "كلمة (الفظّ) مشتق نوعه:", opts: ["اسم فاعل", "صفة مشبّهة باسم الفاعل", "اسم تفضيل", "اسم آلة"], ans: 1 },
        { q: "إعراب جملة (قد بلَغَتْ):", opts: ["في محل نصب حال", "في محل جر مضاف إليه", "في محل رفع صفة", "استئنافية لا محل لها"], ans: 0 },
        { q: "إعراب جملة (أفاضت):", opts: ["في محل رفع خبر", "في محل نصب حال", "صلة الموصول لا محل لها", "في محل جر صفة"], ans: 2 },
        { q: "إعراب جملة (هاجتني):", opts: ["في محل رفع خبر", "في محل نصب حال", "معطوفة على جملة ابتدائية", "في محل جرّ بالإضافة"], ans: 2 },
        { q: "المحسّن البديعي بين (النّعيم) و (الرّزايا):", opts: ["طباق إيجاب", "طباق سلب", "جناس ناقص", "مقابلة"], ans: 0 },
        { q: "مصدر الموسيقا في (اشتياقي / الرِّفاقِ):", opts: ["الجناس", "التّصريع", "الطّباق", "أ+ب"], ans: 1 },
        { q: "إعراب كلمة (حليفَ):", opts: ["خبر (كان) منصوب", "مفعول به منصوب", "حال منصوبة", "تمييز منصوب"], ans: 0 },
        { q: "إعراب كلمة (ديارَ):", opts: ["مبتدأ مرفوع", "مفعول به لفعل محذوف", "منادى مضاف منصوب", "بدل منصوب"], ans: 2 },
        { q: "إعراب كلمة (الفظَّ):", opts: ["مفعول به ثانٍ منصوب", "صفة (نعت) منصوبة", "حال منصوبة", "مضاف إليه مجرور"], ans: 1 },
        { q: "إعراب كلمة (أبيَّ):", opts: ["حال منصوبة", "خبر (يبقى) منصوب", "مفعول به منصوب", "صفة منصوبة"], ans: 0 },
        { q: "نوع الأسلوبين في (ظمئت إلى الحياة) و (قد بلغت...):", opts: ["الأول إنكاري والثّاني طلبي", "الأول ابتدائي والثاني ابتدائي", "كلاهما طلبي", "الأول ابتدائي والثّاني طلبي"], ans: 3 },
        { q: "التقطيع العروضي الصحيح للبيت الثامن:", opts: ["الخيار (أ)", "الخيار (ب)", "الخيار (ج)", "الخيار (د)"], ans: 1 }
    ];

    function init() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = questions.map((item, i) => `
            <div id="qCard${i}" class="space-y-3">
                <h3 class="text-md font-bold text-slate-800">${i + 1}) ${item.q}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${item.opts.map((opt, j) => `
                        <label class="option-card flex items-center p-3 cursor-pointer">
                            <input type="radio" name="q${i}" value="${j}" class="w-4 h-4 ml-3 accent-pink-600">
                            <span class="text-sm text-slate-700">${opt}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function gradeQuiz() {
        let score = 0;
        questions.forEach((item, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const card = document.getElementById(`qCard${i}`);
            if (selected && parseInt(selected.value) === item.ans) {
                score++;
                card.classList.add('p-3', 'rounded-xl', 'bg-emerald-50', 'border', 'border-emerald-200');
            } else {
                card.classList.add('p-3', 'rounded-xl', 'bg-red-50', 'border', 'border-red-200');
            }
            card.querySelectorAll('input').forEach(inp => inp.disabled = true);
        });
        document.getElementById('scoreDisplay').innerText = `${score}/${questions.length}`;
        document.getElementById('printBtn').classList.remove('hidden');
        document.getElementById('gradeBtn').classList.add('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    init();
</script>
</body>
</html>
