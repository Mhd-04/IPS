<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل لغة عربية | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* هذا الجزء يمنع قص البطاقة بين صفحتين */
        .question-card { 
            page-break-inside: avoid; 
            break-inside: avoid;
            border-radius: 15px; 
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 8px solid #db2777; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        textarea { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #fce7f3; 
            border-radius: 12px; 
            min-height: 100px; 
            resize: none;
            font-size: 1.1rem;
        }

        u { 
            text-decoration: underline !important;
            text-decoration-color: #880808 !important; 
            text-underline-offset: 6px; 
            text-decoration-thickness: 3px; 
        }

        @media print {
            .no-print { display: none !important; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body>

    <div id="contentToExport">
        <div class="female-theme p-6 text-white text-center shadow-lg mb-6">
            <img src="1000219663.jpg" class="w-20 h-20 mx-auto rounded-full border-2 border-white mb-2 bg-white">
            <h1 class="text-2xl font-bold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="stInfo" class="text-md font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-6 max-w-4xl">
            <div id="questions"></div>

            <div class="teacher-rating bg-[#fff1f2] border-2 dashed border-[#db2777] p-6 rounded-2xl my-8 page-break-inside: avoid;">
                <h3 class="text-lg font-bold text-pink-800 mb-4 border-b border-pink-200">ركن التقييم والملاحظات:</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-600 underline text-sm">الدرجة النهائية:</p>
                        <p class="text-gray-400">/ 100</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-600 underline text-sm">توقيع المدرس:</p>
                        <div class="h-8 border-b border-gray-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-10 no-print">
        <button onclick="savePDF()" id="saveBtn" class="bg-green-600 text-white px-12 py-5 rounded-full font-bold text-2xl shadow-2xl active:scale-95 transition-all">
            تحميل الملف PDF الآن
        </button>
    </div>

<script>
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sec = localStorage.getItem('sSection') || "G";
    document.getElementById('stInfo').innerText = `الطالبة: ${name} | الشعبة: ${sec}`;

    const qs = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function init() {
        const container = document.getElementById('questions');
        qs.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتبي الإجابة هنا..."></textarea>
                </div>
            `;
        });
    }

    async function savePDF() {
        const element = document.getElementById('contentToExport');
        const btn = document.getElementById('saveBtn');
        btn.innerText = "جاري المعالجة...";
        btn.disabled = true;

        const opt = {
            margin: [15, 10, 15, 10],
            filename: `عربي_سابع_${name}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            // هذا الخيار السحري لمنع القص العشوائي
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل بنجاح";
            btn.disabled = false;
        });
    }
    init();
</script>
</body>
</html>
