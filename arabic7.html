<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل اللغة العربية - IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff1f2; }
        .header-bg { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* تثبيت عرض الحاوية لمنع تبعثر الصفحات */
        #mainPaper {
            width: 750px;
            margin: 0 auto;
            background: white;
            padding: 2px;
        }

        .q-card { 
            background: white; 
            padding: 20px; 
            margin: 15px; 
            border-right: 10px solid #db2777; 
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-box { 
            width: 100%; 
            min-height: 100px; 
            padding: 15px; 
            border: 2px solid #fbcfe8; 
            border-radius: 10px; 
            font-size: 1.15rem;
            line-height: 1.8;
            color: #1f2937;
            white-space: pre-wrap;
            outline: none;
            display: block;
        }

        u { text-decoration: none; border-bottom: 3px solid #880808; font-weight: bold; }
        .no-print { display: block; text-align: center; padding: 40px; }
    </style>
</head>
<body>

    <div id="mainPaper">
        <div class="header-bg p-8 text-white text-center shadow-md">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 bg-white">
            <h1 class="text-3xl font-bold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentInfo" class="mt-2 text-xl font-bold"></p>
        </div>

        <div id="questionsFlow"></div>

        <div class="p-4">
            <div class="q-card bg-rose-50 border-dashed border-2 border-rose-300">
                <h3 class="text-xl font-bold text-rose-900 mb-4 border-b border-rose-200 pb-2">ركن التقييم والملاحظات:</h3>
                <div class="flex justify-between items-center">
                    <div class="text-lg font-bold">الدرجة: <span class="text-3xl text-[#880808]">/ 100</span></div>
                    <div class="text-lg font-bold">توقيع المدرس: .....................</div>
                </div>
            </div>
        </div>
    </div>

    <div class="no-print">
        <button onclick="captureAndSave()" id="btnAction" class="bg-gradient-to-r from-green-600 to-emerald-700 text-white px-20 py-6 rounded-full font-black text-2xl shadow-2xl active:scale-95">
            تحميل الورقة (الحل المضمون)
        </button>
    </div>

<script>
    // بيانات الطالبة
    const sName = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sSec = localStorage.getItem('sSection') || "G";
    document.getElementById('studentInfo').innerText = `الطالبة: ${sName} | الشعبة: ${sSec}`;

    // مصفوفة الأسئلة
    const qs = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    // عرض الأسئلة
    const flow = document.getElementById('questionsFlow');
    qs.forEach((q, i) => {
        flow.innerHTML += `
            <div class="q-card">
                <h2 class="text-xl font-bold mb-4 text-gray-800">${i + 1}) ${q}</h2>
                <div contenteditable="true" class="input-box"></div>
            </div>
        `;
    });

    // الوظيفة السحرية للتحميل بدون أخطاء
    async function captureAndSave() {
        const btn = document.getElementById('btnAction');
        const element = document.getElementById('mainPaper');
        btn.innerText = "جاري الحفظ بدقة عالية...";
        btn.disabled = true;

        // التقاط الورقة كصورة كاملة لمنع تقطع الخط العربي
        html2canvas(element, {
            scale: 2, // دقة مضاعفة
            useCORS: true,
            allowTaint: true,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            
            // إنشاء PDF بأبعاد ديناميكية تناسب طول الورقة تماماً
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const imgWidth = pageWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            // إذا كانت الورقة أطول من صفحة A4، سيقوم النظام بتوزيعها بذكاء
            let heightLeft = imgHeight;
            let position = 0;

            pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
            heightLeft -= pageHeight;

            while (heightLeft >= 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
            }

            pdf.save(`ورقة_اللغة_العربية_${sName}.pdf`);
            btn.innerText = "تم التحميل بنجاح";
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
