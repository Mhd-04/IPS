<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل اللغة العربية - IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; margin: 0; padding: 0; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        #worksheetContainer {
            width: 800px; /* عرض ثابت لضمان الجودة */
            margin: 0 auto;
            background: white;
            padding-bottom: 30px;
        }

        .question-card { 
            background: white; 
            padding: 20px; 
            margin: 15px;
            border-right: 10px solid #db2777; 
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .answer-area { 
            width: 100%; 
            min-height: 100px; 
            padding: 15px; 
            border: 2px solid #fce7f3; 
            border-radius: 12px; 
            font-size: 1.1rem;
            line-height: 1.8;
            text-align: right;
            white-space: pre-wrap;
            display: block;
            outline: none;
        }

        u { text-decoration: none; border-bottom: 3px solid #880808; font-weight: bold; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="worksheetContainer">
        <div class="female-theme p-8 text-white text-center shadow-lg mb-6">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 bg-white shadow-md">
            <h1 class="text-3xl font-extrabold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="stDetails" class="mt-2 text-xl font-bold opacity-90"></p>
        </div>

        <div id="questionsWrapper"></div>

        <div class="px-4">
            <div class="question-card bg-[#fff1f2] border-2 dashed border-[#db2777]">
                <h3 class="text-xl font-bold text-pink-800 mb-4 border-b-2 border-pink-200 pb-2">ركن التقييم:</h3>
                <div class="flex justify-between items-center px-4">
                    <div class="text-lg">الدرجة النهائية: <span class="text-2xl font-black text-[#880808]"> / 100</span></div>
                    <div class="text-lg">توقيع المدرس: .......................</div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-12 no-print">
        <button onclick="downloadAsOnePage()" id="downloadBtn" class="bg-green-600 text-white px-20 py-6 rounded-full font-bold text-2xl shadow-2xl active:scale-95">
            تحميل الورقة كاملة (بدون نقص)
        </button>
    </div>

<script>
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sec = localStorage.getItem('sSection') || "G";
    document.getElementById('stDetails').innerText = `الطالبة: ${name} | الشعبة: ${sec}`;

    const arabicQuestions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function render() {
        const wrap = document.getElementById('questionsWrapper');
        arabicQuestions.forEach((q, i) => {
            wrap.innerHTML += `
                <div class="question-card">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">${i + 1}) ${q}</h3>
                    <div contenteditable="true" class="answer-area"></div>
                </div>
            `;
        });
    }

    async function downloadAsOnePage() {
        const btn = document.getElementById('downloadBtn');
        const container = document.getElementById('worksheetContainer');
        btn.innerText = "جاري التقاط الورقة...";
        
        // استخدام html2canvas لالتقاط صورة عالية الدقة لكل المحتوى
        html2canvas(container, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            
            // حساب أبعاد الـ PDF بناءً على حجم الصورة الناتجة
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgProps = pdf.getImageProperties(imgData);
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save(`ورقة_عربي_${name}.pdf`);
            btn.innerText = "تم التحميل بنجاح";
        });
    }
    render();
</script>
</body>
</html>
