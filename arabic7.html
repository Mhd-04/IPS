<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل اللغة العربية - السابع | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdf2f2; }
        /* اللون العنابي المخصص للرأس */
        .arabic-theme { background: linear-gradient(135deg, #60001a, #800020); }
        /* حدود البطاقات بالعنابي */
        .question-card { border-radius: 20px; background: white; padding: 25px; margin-bottom: 25px; border-right: 10px solid #800020; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        textarea { width: 100%; padding: 15px; border: 2px solid #e5e7eb; border-radius: 15px; min-height: 100px; outline: none; transition: 0.3s; font-size: 1.1rem; }
        textarea:focus { border-color: #800020; ring: 2px solid #800020; }
        /* تنسيق الخطوط تحت الكلمات المطلوبة */
        u { text-decoration-color: #800020; text-underline-offset: 6px; font-weight: bold; text-decoration-thickness: 2.5px; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="arabicCaptureArea">
        <div class="arabic-theme p-10 text-white text-center shadow-2xl mb-10">
            <img src="1000219663.jpg" class="w-28 h-28 mx-auto rounded-full border-4 border-white mb-5 bg-white shadow-lg">
            <h1 class="text-4xl font-extrabold mb-3">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentInfo" class="text-xl font-bold opacity-95"></p>
        </div>

        <div class="container mx-auto px-6 max-w-4xl">
            <div id="questionsContainer"></div>

            <div id="resultBox" class="mt-12 p-10 rounded-[40px] text-center mb-12 border-4 border-[#800020] bg-white shadow-2xl">
                <div class="mb-8 border-b-2 border-dashed border-red-100 pb-6">
                    <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full mb-4 shadow-md">
                    <h2 class="text-3xl font-bold text-gray-800" id="resName"></h2>
                    <p class="text-[#800020] text-xl font-bold mt-2" id="resClass"></p>
                </div>
                
                <h3 class="text-2xl font-bold text-gray-700 mb-6 italic underline decoration-red-200">التقييم الوزاري والدرجة</h3>
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div class="p-6 bg-red-50 rounded-2xl border border-red-100">
                        <p class="text-lg text-gray-500 mb-1">الدرجة:</p>
                        <p class="text-3xl font-bold text-[#800020]">/ 100</p>
                    </div>
                    <div class="p-6 bg-red-50 rounded-2xl border border-red-100">
                        <p class="text-lg text-gray-500 mb-1">توقيع المعلم:</p>
                        <div class="h-10 border-b-2 border-gray-300"></div>
                    </div>
                </div>

                <button onclick="downloadArabicPDF()" id="pdfBtn" class="no-print bg-[#800020] text-white px-12 py-5 rounded-3xl font-bold text-2xl shadow-2xl hover:bg-[#60001a] transition transform hover:scale-105 active:scale-95">
                    حفظ الورقة PDF
                </button>
            </div>
        </div>
    </div>

<script>
    const sName = localStorage.getItem('sName') || "اسم الطالب/ة";
    const sSection = localStorage.getItem('sSection') || "غير محدد";
    
    document.getElementById('studentInfo').innerText = `الطالب/ة: ${sName} | الشعبة: ${sSection}`;
    document.getElementById('resName').innerText = "الاسم: " + sName;
    document.getElementById('resClass').innerText = "الصف: السابع | الشعبة: " + sSection;

    // الأسئلة مع الكلمات المحددة بدقة
    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function init() {
        const container = document.getElementById('questionsContainer');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card animate-fade-in">
                    <h3 class="text-2xl font-bold mb-4 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتبي الإجابة النموذجية هنا..."></textarea>
                </div>
            `;
        });
    }

    async function downloadArabicPDF() {
        const element = document.getElementById('arabicCaptureArea');
        const btn = document.getElementById('pdfBtn');
        btn.innerText = "جاري الحفظ... يرجى الانتظار";
        btn.disabled = true;

        await new Promise(r => setTimeout(r, 3000));

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `اجابة_عربي_سابع_${sName}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 3, useCORS: true, scrollY: 0, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل بنجاح";
            btn.disabled = false;
        });
    }

    init();
</script>
</body>
</html>
