<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل اللغة العربية - السابع | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* نفس خلفية التاريخ */
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        
        /* نفس التدرج اللوني لكويز التاريخ (العنابي للزهري) */
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* نفس تصميم بطاقة السؤال والخط الزهري الجانبي */
        .question-card { 
            border-radius: 20px; 
            background: white; 
            padding: 18px; 
            margin-bottom: 15px; 
            border-right: 8px solid #db2777; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        
        textarea { 
            width: 100%; 
            padding: 10px; 
            border: 2px solid #fce7f3; 
            border-radius: 12px; 
            min-height: 90px; 
            outline: none; 
            transition: 0.3s; 
        }
        
        textarea:focus { border-color: #db2777; background-color: #fffbff; }

        /* ركن التقييم بنفس ستايل التاريخ */
        .teacher-rating { 
            background: #fff1f2; 
            border: 2px dashed #db2777; 
            border-radius: 20px; 
            padding: 20px; 
            margin-top: 30px; 
        }

        /* الكلمات المطلوب إعرابها تحتها خط عنابي */
        u { 
            text-decoration: underline !important;
            text-decoration-color: #880808 !important; 
            text-underline-offset: 6px; 
            font-weight: bold; 
            text-decoration-thickness: 3px; 
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="arabicCaptureArea">
        <div class="female-theme p-8 text-white text-center shadow-lg mb-6">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 bg-white shadow-md">
            <h1 class="text-3xl font-extrabold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentInfoBox" class="mt-2 text-lg font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-4 max-w-4xl">
            <div id="arabicQuestions"></div>

            <div class="teacher-rating">
                <h3 class="text-xl font-bold text-pink-800 mb-4 border-b-2 border-pink-200 pb-2 italic">ركن التقييم والملاحظات (خاص بالمعلم):</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow-inner border border-pink-100">
                        <p class="font-bold text-gray-600 mb-2 underline">الدرجة النهائية:</p>
                        <p class="text-gray-300">/ 100</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow-inner border border-pink-100">
                        <p class="font-bold text-gray-600 mb-2 underline">توقيع المدرس:</p>
                        <div class="h-10"></div>
                    </div>
                </div>
            </div>

            <div class="text-center py-12 no-print">
                <button onclick="downloadArabicPDF()" id="downloadBtn" class="bg-green-600 text-white px-12 py-5 rounded-3xl font-bold text-2xl shadow-2xl hover:bg-green-700 transition transform active:scale-95">
                    حفظ الإجابات وتحميل PDF
                </button>
            </div>
        </div>
    </div>

<script>
    const sName = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sSection = localStorage.getItem('sSection') || "G";
    document.getElementById('studentInfoBox').innerText = `الطالبة: ${sName} | الشعبة: ${sSection}`;

    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function renderQuestions() {
        const container = document.getElementById('arabicQuestions');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-lg font-bold mb-2 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتبي إجابتكِ هنا..."></textarea>
                </div>
            `;
        });
    }

    async function downloadArabicPDF() {
        const element = document.getElementById('arabicCaptureArea');
        const btn = document.getElementById('downloadBtn');
        btn.innerText = "جاري الحفظ...";
        btn.disabled = true;
        await new Promise(r => setTimeout(r, 2000));

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `عربي_سابع_${sName}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل";
            btn.disabled = false;
        });
    }

    renderQuestions();
</script>
</body>
</html>
