<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل اللغة العربية - الخط الصحيح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fdf2f8; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* البطاقة مصممة لتكون "صورة" واضحة عند التصدير */
        .question-card { 
            page-break-inside: avoid !important; 
            background: white; 
            padding: 25px; 
            margin-bottom: 25px; 
            border-right: 10px solid #db2777; 
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        /* هذا التنسيق يمنع الحروف من التقطع */
        .answer-box { 
            width: 100%; 
            min-height: 120px; 
            padding: 15px; 
            border: 2px solid #fbcfe8; 
            border-radius: 15px; 
            font-size: 1.2rem;
            line-height: 2;
            color: #1f2937;
            text-align: right;
            direction: rtl;
            white-space: pre-wrap;
            background-color: #fff;
        }

        u { 
            text-decoration: none;
            border-bottom: 3px solid #880808;
            padding-bottom: 2px;
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="printableArea" class="max-w-4xl mx-auto bg-white shadow-2xl">
        <div class="female-theme p-10 text-white text-center rounded-b-[50px] shadow-xl mb-10">
            <img src="1000219663.jpg" class="w-28 h-28 mx-auto rounded-full border-4 border-white mb-4 bg-white shadow-lg">
            <h1 class="text-3xl font-black mb-2">ورقة عمل مادة اللغة العربية</h1>
            <p id="stInfo" class="text-xl font-bold opacity-90"></p>
        </div>

        <div id="questionsList" class="p-6"></div>

        <div class="p-6">
            <div class="question-card bg-pink-50 border-dashed border-4 border-pink-300">
                <h3 class="text-xl font-bold text-pink-900 mb-6 border-b-2 border-pink-200 pb-2">نتائج التقييم:</h3>
                <div class="grid grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-inner border border-pink-100">
                        <span class="text-gray-500 font-bold block mb-2">الدرجة:</span>
                        <span class="text-4xl text-[#880808] font-black">/ 100</span>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-inner border border-pink-100">
                        <span class="text-gray-500 font-bold block mb-2">التوقيع:</span>
                        <div class="mt-4 border-b-2 border-gray-200 w-full h-8"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-16 no-print">
        <button onclick="generateCleanPDF()" id="actionBtn" class="bg-gradient-to-r from-pink-600 to-rose-700 text-white px-20 py-6 rounded-full font-black text-2xl shadow-2xl hover:scale-105 transition-transform">
            تحميل الورقة (الخط المصلح)
        </button>
    </div>

<script>
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sec = localStorage.getItem('sSection') || "G";
    document.getElementById('stInfo').innerText = `الطالبة: ${name} | الشعبة: ${sec}`;

    const qs = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function render() {
        const container = document.getElementById('questionsList');
        qs.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h2 class="text-xl font-bold mb-5 text-gray-800 leading-relaxed">${i + 1}) ${q}</h2>
                    <div contenteditable="true" class="answer-box"></div>
                </div>
            `;
        });
    }

    async function generateCleanPDF() {
        const element = document.getElementById('printableArea');
        const btn = document.getElementById('actionBtn');
        btn.innerText = "جاري الحفظ بجودة عالية...";
        
        const opt = {
            margin: [5, 5, 5, 5],
            filename: `عربي_سابع_نهائي.pdf`,
            image: { type: 'jpeg', quality: 1 },
            // السر هنا: استخدام نظام الـ Canvas عالي الدقة لتجنب تقطع الحروف
            html2canvas: { 
                scale: 2.5, 
                useCORS: true, 
                letterRendering: false,
                onclone: (clonedDoc) => {
                    // إجبار الخط العربي على الظهور بشكل صحيح في النسخة المستنسخة
                    clonedDoc.getElementById('printableArea').style.fontFamily = "'Tajawal', sans-serif";
                }
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل بنجاح";
        });
    }
    render();
</script>
</body>
</html>
