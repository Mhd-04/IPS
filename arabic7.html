<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل اللغة العربية - السابع | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* البطاقة تتمدد حسب المحتوى ولا تنقص */
        .question-card { 
            page-break-inside: avoid !important; 
            break-inside: avoid !important;
            background: white; 
            padding: 20px; 
            margin-bottom: 25px; 
            border-right: 8px solid #db2777; 
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: block;
            width: 100%;
        }
        
        /* جعل خانة الإجابة تتمدد تلقائياً لتظهر كامل الكتابة */
        .answer-area { 
            width: 100%; 
            min-height: 100px;
            height: auto; 
            padding: 15px; 
            border: 2px solid #fce7f3; 
            border-radius: 12px; 
            font-size: 1.1rem;
            line-height: 1.6;
            display: block;
            white-space: pre-wrap; /* يحافظ على تنسيق الأسطر عند التحميل */
        }

        u { 
            text-decoration: underline !important;
            text-decoration-color: #880808 !important; 
            text-underline-offset: 6px; 
            text-decoration-thickness: 3px; 
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="fullDocument" class="max-w-4xl mx-auto">
        <div class="female-theme p-8 text-white text-center shadow-lg mb-8">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 bg-white shadow-md">
            <h1 class="text-3xl font-extrabold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentDisplay" class="mt-2 text-xl font-bold opacity-90"></p>
        </div>

        <div id="questionsContainer" class="px-4"></div>

        <div class="px-4">
            <div class="question-card bg-[#fff1f2] border-2 dashed border-[#db2777]">
                <h3 class="text-xl font-bold text-pink-800 mb-4 border-b-2 border-pink-200 pb-2">ركن التقييم والملاحظات:</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-600 underline mb-2">الدرجة النهائية:</p>
                        <p class="text-3xl text-[#880808] font-bold">/ 100</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-600 underline mb-2">توقيع المدرس:</p>
                        <div class="h-10 border-b-2 border-gray-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-12 no-print">
        <button onclick="downloadCompletePDF()" id="actionBtn" class="bg-green-600 text-white px-16 py-6 rounded-full font-bold text-2xl shadow-2xl hover:bg-green-700 transition transform active:scale-95">
            تحميل الورقة كاملة PDF
        </button>
    </div>

<script>
    // جلب البيانات من التخزين
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const section = localStorage.getItem('sSection') || "G";
    document.getElementById('studentDisplay').innerText = `الطالبة: ${name} | الشعبة: ${section}`;

    // كافة الأسئلة الـ 9 المطلوبة
    const arabicQuestions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        arabicQuestions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-xl font-bold mb-4 text-gray-800">${i + 1}) ${q}</h3>
                    <div contenteditable="true" class="answer-area" placeholder="اكتبي الإجابة هنا..."></div>
                </div>
            `;
        });
    }

    async function downloadCompletePDF() {
        const element = document.getElementById('fullDocument');
        const btn = document.getElementById('actionBtn');
        btn.innerText = "جاري حفظ كل الأسئلة...";
        btn.disabled = true;

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `ورقة_عربي_كاملة_${name}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 3, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            // منع قص البطاقات وضمان استمرارية الصفحات
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل بنجاح";
            btn.disabled = false;
        });
    }

    renderQuestions();
</script>
</body>
</html>
