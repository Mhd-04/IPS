<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل اللغة العربية - السابع | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f9fafb; }
        .arabic-theme { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
        .question-card { border-radius: 20px; background: white; padding: 20px; margin-bottom: 20px; border-right: 8px solid #1e3a8a; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        textarea { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 12px; min-height: 80px; outline: none; transition: 0.3s; }
        textarea:focus { border-color: #1e3a8a; }
        /* تحسين مظهر الخط تحت الكلمات */
        u { text-decoration-color: #1e3a8a; text-underline-offset: 4px; font-weight: bold; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="arabicCaptureArea">
        <div class="arabic-theme p-8 text-white text-center shadow-lg mb-8">
            <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-white mb-4 bg-white">
            <h1 class="text-3xl font-extrabold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentInfo" class="mt-2 text-lg font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-4 max-w-4xl">
            <div id="questionsContainer"></div>

            <div id="resultBox" class="mt-10 p-8 rounded-[35px] text-center mb-10 border-4 border-blue-600 bg-white shadow-2xl">
                <div class="mb-6 border-b-2 border-dashed border-blue-200 pb-4">
                    <img src="1000219663.jpg" class="w-20 h-20 mx-auto rounded-full mb-3 shadow-md">
                    <h2 class="text-2xl font-bold text-gray-800" id="resName"></h2>
                    <p class="text-blue-600 font-bold" id="resClass"></p>
                </div>
                
                <h3 class="text-xl font-bold text-gray-700 mb-4 italic">تقييم المدرس والدرجة:</h3>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <p class="text-sm text-gray-500">الدرجة:</p>
                        <p class="text-2xl font-bold">/ 100</p>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <p class="text-sm text-gray-500">التوقيع:</p>
                        <div class="h-8"></div>
                    </div>
                </div>

                <button onclick="downloadArabicPDF()" id="pdfBtn" class="no-print bg-green-600 text-white px-10 py-4 rounded-2xl font-bold text-xl shadow-lg hover:bg-green-700 transition">
                    تحميل الورقة PDF لإرسالها
                </button>
            </div>
        </div>
    </div>

<script>
    const sName = localStorage.getItem('sName') || "طالب/ة";
    const sSection = localStorage.getItem('sSection') || "-";
    
    document.getElementById('studentInfo').innerText = `الطالب/ة: ${sName} | الشعبة: ${sSection}`;
    document.getElementById('resName').innerText = "الاسم: " + sName;
    document.getElementById('resClass').innerText = "الصف والشعبة: " + sSection;

    // الأسئلة مع الكلمات التي تحتها خط بناءً على ورقتك الأصلية
    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى: مناكب - جذوة؟",
        "اشرح البيت التالي: فأهلها شعلة لم تخب جذوتها★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط: (ترى <u>قلاعاً</u> أقيمت في <u>مناكبها</u>★★★تحكي الحضارة مذ <u>قامت</u> و<u>تبديها</u>)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً★★★مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات: (تشاؤون - ضياء)"
    ];

    function init() {
        const container = document.getElementById('questionsContainer');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-xl font-bold mb-3 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتبي الإجابة النموذجية هنا..."></textarea>
                </div>
            `;
        });
    }

    // حل مشكلة الـ PDF الفارغ وزيادة الدقة
    async function downloadArabicPDF() {
        const element = document.getElementById('arabicCaptureArea');
        const btn = document.getElementById('pdfBtn');
        btn.innerText = "جاري التحضير... انتظر قليلاً";
        btn.disabled = true;

        await new Promise(r => setTimeout(r, 3000));

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `عربي_سابع_${sName}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل";
            btn.disabled = false;
        });
    }

    init();
</script>
</body>
</html>
