<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل اللغة العربية - السابع | IPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fafafa; }
        
        /* اللون العنابي الغامق جداً المطابق لآخر صورة */
        .bg-deep-maroon { background-color: #42000d !important; } 
        
        .question-card { 
            border-radius: 20px; 
            background: white; 
            padding: 25px; 
            margin-bottom: 20px; 
            border-right: 15px solid #42000d !important; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.12); 
        }
        
        textarea { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #eee; 
            border-radius: 15px; 
            min-height: 110px; 
            outline: none; 
            font-size: 1.1rem; 
        }
        
        textarea:focus { border-color: #42000d !important; }

        /* الكلمات المطلوب إعرابها تحتها خط عنابي سميك */
        u { 
            text-decoration: underline !important;
            text-decoration-color: #42000d !important; 
            text-underline-offset: 8px; 
            font-weight: bold; 
            text-decoration-thickness: 4px; 
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="arabicCaptureArea">
        <div class="bg-deep-maroon p-12 text-white text-center shadow-2xl mb-10">
            <img src="1000219663.jpg" class="w-32 h-32 mx-auto rounded-full border-4 border-white mb-6 bg-white shadow-lg">
            <h1 class="text-4xl font-extrabold mb-3">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentInfo" class="text-2xl font-bold opacity-90"></p>
        </div>

        <div class="container mx-auto px-6 max-w-4xl">
            <div id="questionsContainer"></div>

            <div id="resultBox" class="mt-14 p-12 rounded-[50px] text-center mb-14 border-4 border-[#42000d] bg-white shadow-2xl">
                <div class="mb-8 border-b-2 border-dashed border-gray-200 pb-8 text-center">
                    <img src="1000219663.jpg" class="w-24 h-24 mx-auto rounded-full mb-4 shadow-md">
                    <h2 class="text-3xl font-bold text-gray-800" id="resName"></h2>
                    <p class="text-[#42000d] text-2xl font-bold" id="resClass"></p>
                </div>
                
                <div class="grid grid-cols-2 gap-8 mb-10">
                    <div class="p-8 bg-gray-50 rounded-3xl border border-gray-100">
                        <p class="text-gray-500 mb-2 text-lg">الدرجة النهائية:</p>
                        <p class="text-4xl font-bold text-[#42000d]">/ 100</p>
                    </div>
                    <div class="p-8 bg-gray-50 rounded-3xl border border-gray-100">
                        <p class="text-gray-500 mb-2 text-lg">توقيع المدرس:</p>
                        <div class="h-12 border-b-2 border-gray-300"></div>
                    </div>
                </div>

                <button onclick="downloadArabicPDF()" id="pdfBtn" class="no-print bg-[#42000d] text-white px-16 py-6 rounded-3xl font-bold text-2xl shadow-2xl hover:opacity-90 transition transform hover:scale-105">
                    حفظ الملف كـ PDF
                </button>
            </div>
        </div>
    </div>

<script>
    // جلب البيانات المخزنة من التسجيل
    const sName = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sSection = localStorage.getItem('sSection') || "H";
    
    document.getElementById('studentInfo').innerText = `الطالب/ة: ${sName} | الشعبة: ${sSection}`;
    document.getElementById('resName').innerText = "اسم الطالب: " + sName;
    document.getElementById('resClass').innerText = "الشعبة: " + sSection;

    // الأسئلة مع الخطوط تحت الكلمات الخمسة المطلوبة
    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function init() {
        const container = document.getElementById('questionsContainer');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-2xl font-bold mb-5 text-gray-800">${i + 1}) ${q}</h3>
                    <textarea placeholder="اكتب الإجابة هنا..."></textarea>
                </div>
            `;
        });
    }

    async function downloadArabicPDF() {
        const element = document.getElementById('arabicCaptureArea');
        const btn = document.getElementById('pdfBtn');
        btn.innerText = "جاري المعالجة...";
        btn.disabled = true;
        await new Promise(r => setTimeout(r, 2000));

        const opt = {
            margin: [10, 5, 10, 5],
            filename: `ورقة_عمل_عربي_${sName}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 3, useCORS: true, scrollY: 0 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل بنجاح";
            btn.disabled = false;
        });
    }

    init();
</script>
</body>
</html>
