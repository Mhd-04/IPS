<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل لغة عربية - كاملة الإجابات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* هذا الجزء يضمن ظهور الإجابة كاملة مهما طالت */
        .answer-box { 
            width: 100%; 
            min-height: 80px; 
            height: auto; /* يتمدد تلقائياً */
            padding: 12px; 
            border: 2px solid #fce7f3; 
            border-radius: 12px; 
            font-size: 1rem;
            line-height: 1.6;
            word-wrap: break-word; /* يكسر الكلام الطويل عشان ما يختفي */
            overflow-wrap: break-word;
            white-space: pre-wrap; /* يحافظ على الأسطر الجديدة */
            background: #ffffff;
            display: block;
        }

        .question-card { 
            page-break-inside: avoid !important; 
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-right: 8px solid #db2777; 
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        u { 
            text-decoration: underline !important;
            text-decoration-color: #880808 !important; 
            text-underline-offset: 5px; 
            text-decoration-thickness: 2px; 
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="pdfContent">
        <div class="female-theme p-6 text-white text-center shadow-lg mb-6">
            <img src="1000219663.jpg" class="w-20 h-20 mx-auto rounded-full border-2 border-white mb-2 bg-white shadow-sm">
            <h1 class="text-2xl font-bold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="stDisplay" class="text-sm font-bold opacity-90 mt-1"></p>
        </div>

        <div class="container mx-auto px-4 max-w-4xl">
            <div id="qsContainer"></div>

            <div class="question-card bg-[#fff1f2] border-2 dashed border-[#db2777] mt-8">
                <h3 class="text-lg font-bold text-pink-800 mb-4 border-b border-pink-200 pb-2">ركن التقييم والملاحظات:</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-500 text-xs mb-1 underline">الدرجة النهائية:</p>
                        <p class="text-2xl text-[#880808] font-bold">/ 100</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-pink-100">
                        <p class="font-bold text-gray-500 text-xs mb-1 underline">توقيع المدرس:</p>
                        <div class="h-8 border-b border-gray-100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-10 no-print">
        <button onclick="saveFullPDF()" id="saveBtn" class="bg-green-600 text-white px-12 py-5 rounded-full font-bold text-xl shadow-2xl active:scale-95">
            حفظ وتحميل PDF (كامل الإجابات)
        </button>
    </div>

<script>
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sec = localStorage.getItem('sSection') || "G";
    document.getElementById('stDisplay').innerText = `الطالبة: ${name} | الشعبة: ${sec}`;

    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي شرحاً وافياً: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط إعراباً كاملاً: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به واحدد نوعه من جملة: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به المفرد إلى مثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة على صورتها في الكلمات التالية: (تشاؤون - ضياء)"
    ];

    function loadQs() {
        const container = document.getElementById('qsContainer');
        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-card">
                    <h3 class="text-lg font-bold mb-3 text-gray-800">${i + 1}) ${q}</h3>
                    <div contenteditable="true" class="answer-box" placeholder="اكتبي الإجابة هنا..."></div>
                </div>
            `;
        });
    }

    async function saveFullPDF() {
        const element = document.getElementById('pdfContent');
        const btn = document.getElementById('saveBtn');
        btn.innerText = "جاري الحفظ...";
        
        const opt = {
            margin: [10, 5, 10, 5],
            filename: `ورقة_عربي_كاملة.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerText = "تم التحميل";
        });
    }
    loadQs();
</script>
</body>
</html>
