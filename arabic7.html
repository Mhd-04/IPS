<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة عمل لغة عربية - الحل النهائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fff5f7; margin: 0; padding: 0; }
        .female-theme { background: linear-gradient(135deg, #880808, #db2777); }
        
        /* هذا الجزء يمنع التقطيع والصفحات الإضافية */
        .pdf-page-fixed {
            width: 790px; /* عرض ثابت لضمان عدم تمدد العناصر */
            margin: auto;
            background: white;
        }

        .question-card { 
            page-break-inside: avoid !important; 
            break-inside: avoid !important;
            background: white; 
            padding: 20px; 
            margin: 10px 15px;
            border-right: 8px solid #db2777; 
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .answer-box { 
            width: 100%; 
            min-height: 90px; 
            padding: 12px; 
            border: 2px solid #fce7f3; 
            border-radius: 10px; 
            font-size: 1.1rem;
            line-height: 1.7;
            text-align: right;
            direction: rtl;
            white-space: pre-wrap;
            display: block;
        }

        u { text-decoration: none; border-bottom: 2px solid #880808; font-weight: bold; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div id="finalPDFContent" class="pdf-page-fixed">
        <div class="female-theme p-6 text-white text-center shadow-md mb-4">
            <img src="1000219663.jpg" class="w-20 h-20 mx-auto rounded-full border-2 border-white mb-2 bg-white">
            <h1 class="text-2xl font-bold">ورقة عمل مادة اللغة العربية - الصف السابع</h1>
            <p id="studentDisplay" class="text-sm font-bold opacity-90"></p>
        </div>

        <div id="qsList"></div>

        <div class="p-4">
            <div class="question-card bg-[#fff1f2] border-2 dashed border-[#db2777]">
                <h3 class="text-lg font-bold text-pink-800 mb-2 underline">ركن التقييم:</h3>
                <div class="flex justify-between text-sm">
                    <div>الدرجة: <span class="font-bold text-[#880808]">/ 100</span></div>
                    <div>توقيع المدرس: __________</div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center py-10 no-print">
        <button onclick="downloadAsImagePDF()" id="btn" class="bg-green-600 text-white px-12 py-5 rounded-full font-bold text-xl shadow-2xl">
            تحميل الملف (بخط سليم تماماً)
        </button>
    </div>

<script>
    const name = localStorage.getItem('sName') || "الاء فرحان الغفري";
    const sec = localStorage.getItem('sSection') || "G";
    document.getElementById('studentDisplay').innerText = `الطالبة: ${name} | الشعبة: ${sec}`;

    const questions = [
        "اكتب بيتين من قصيدة (جزيرة أرواد)",
        "ما معنى الكلمات التالية: (مناكب - جذوة)؟",
        "اشرح البيت التالي: فأهلها شعلة لم تخب جذوتها ★★★ خاضوا الحياة وباتوا في أعاليها",
        "ما وزن الكلمات التالية: (مكتحل - عواصف)؟",
        "أعرب ما تحته خط: (<u>ترى</u> <u>قلاعاً</u> أقيمت في <u>مناكبها</u> ★★★ <u>تحكي</u> الحضارة مذ <u>قامت</u> وتبديها)",
        "استخرج مفعول به: سقى الله عند اللاذقية شاطئاً ★★★ مراحاً لأحلامي ومغنى وملعبا",
        "حول المفعول به للمثنى: (رأى الفلاح عصفوراً على الشجرة)",
        "ما أنواع الأفعال من حيث الصحة والاعتلال: (وقف - يستغفر)؟",
        "علل كتابة الهمزة في: (تشاؤون - ضياء)"
    ];

    function render() {
        const c = document.getElementById('qsList');
        questions.forEach((q, i) => {
            c.innerHTML += `
                <div class="question-card">
                    <h3 class="text-lg font-bold mb-3 text-gray-800">${i + 1}) ${q}</h3>
                    <div contenteditable="true" class="answer-box"></div>
                </div>
            `;
        });
    }

    async function downloadAsImagePDF() {
        const el = document.getElementById('finalPDFContent');
        const b = document.getElementById('btn');
        b.innerText = "جاري المعالجة الصورية...";
        
        const opt = {
            margin: 5,
            filename: `عربي_سابع_مضمون.pdf`,
            image: { type: 'jpeg', quality: 1 },
            // تفعيل نظام التصوير الكامل لمنع "الكلمات غير المفهومة"
            html2canvas: { 
                scale: 2, 
                useCORS: true, 
                letterRendering: false,
                scrollX: 0,
                scrollY: 0
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: 'css' }
        };

        html2pdf().set(opt).from(el).save().then(() => {
            b.innerText = "تم التحميل";
        });
    }
    render();
</script>
</body>
</html>
